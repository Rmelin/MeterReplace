name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # WeasyPrint (PDF-breve) kræver Pango/Cairo som systembiblioteker
      - name: Installer systemafhængigheder til WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libffi8

      - name: Installer Python-afhængigheder
        run: pip install -r requirements.txt

      - name: Kør migrationer mod tom database
        run: python -m alembic upgrade head

      - name: Kør tests
        run: python -m unittest discover -s tests -v
